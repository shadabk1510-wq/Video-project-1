<title>12 Three touchpoints: phone, product page, pack (revealed soon)</title>
<style>
.ghost{position:absolute;left:0;transform:translateX(-50%);font-size:180px;font-weight:800;letter-spacing:-.05em;line-height:1;color:rgba(255,255,255,.26);white-space:nowrap}
.gl{position:absolute;background:rgba(255,255,255,.55)}
.hd{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;background:#fff}
#frame{position:absolute;width:960px;height:960px;left:0;top:0;pointer-events:none}
#frame img{width:960px;height:960px;filter:drop-shadow(0 40px 50px rgba(110,30,38,.35))}
#feed{position:absolute;left:-210px;width:420px}
#feed img{width:420px}
#soon{position:absolute;left:0;top:-340px;transform:translateX(-50%);background:#EA6262;color:#fff;letter-spacing:.14em;font-size:21px;padding:10px 20px}
.win{position:absolute;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 2px 4px rgba(120,40,45,.06),0 30px 60px -20px rgba(150,50,58,.42)}
.bar{position:absolute;left:0;top:0;right:0;height:44px;background:#FBF1F0;border-bottom:1.5px solid #F2E2E1}
.dots{position:absolute;left:18px;top:16px;display:flex;gap:7px}.dots i{width:11px;height:11px;border-radius:50%}
.url{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:46%;height:26px;border-radius:13px;background:#F3E2E1;font-size:13px;color:#9C7F81;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#EA6262;color:#fff;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(255,255,255,.9),0 14px 30px -10px rgba(150,50,58,.5)}
.lab{position:absolute;transform:translateX(-50%);display:flex;align-items:center;gap:12px;font-size:38px;font-weight:600;color:#2B1C1E;white-space:nowrap}
#path{position:absolute;left:-1000px;top:-700px;width:2000px;height:1400px;overflow:visible}
</style>
<div data-slot="world">
  <svg id="path" viewBox="-1000 -700 2000 1400"><path id="jp" d="" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16"/></svg>
  <div class="win" id="web" style="width:720px;height:480px">
    <div id="webPage" style="position:absolute;left:0;top:44px;width:720px;filter:blur(9px)"><img src="../assets/product_page.png" style="width:720px"></div>
    <div class="bar"><div class="dots"><i style="background:#F57F7A"></i><i style="background:#F6C25B"></i><i style="background:#6CCB7E"></i></div><div class="url">noon &rsaquo; high-sun</div></div>
  </div>
  <div class="win" id="pack" style="width:380px;height:480px"><img src="../assets/bag.png" style="position:absolute;left:-60px;top:-10px;width:500px;filter:blur(8px)"></div>
  <div class="badge" id="b0">1</div><div class="badge" id="b1">2</div><div class="badge" id="b2">3</div>
  <div class="lab" data-t="translateX(-50%)" id="l0"><span id="i0"></span>Social post</div><div class="lab" data-t="translateX(-50%)" id="l1"><span id="i1"></span>Product page</div><div class="lab" data-t="translateX(-50%)" id="l2"><span id="i2"></span>Packaging</div>
</div><!--/world-->
<div data-slot="shape">
  <div class="L" id="Lpro">
    <div id="grid"></div>
    <div class="ghost" style="top:-370px">PROFESSIONAL</div><div class="ghost" style="top:190px">PROFESSIONAL</div>
    <div class="row" style="left:0;top:-150px;transform:translateX(-50%);color:#fff;font-size:22px;font-weight:600;letter-spacing:.5em;text-transform:uppercase">High-level</div>
    <div class="row" style="transform:translate(-50%,-50%);font-size:180px;font-weight:800;letter-spacing:-.05em;line-height:1;color:#fff">PROFESSIONAL</div>
    <div class="row" style="left:0;top:395px;transform:translateX(-50%);font-size:40px;font-weight:600;color:#fff">designers from everybody else.</div>
  </div>
  <div class="L" id="Lscreen">
    <div id="feed" style="filter:blur(10px)"><img src="../assets/social1.png"><img src="../assets/product_page.png"><img src="../assets/bag.png"><img src="../assets/social2.png"></div>
    <div class="chip" id="soon">REVEALED SOON</div>
  </div>
</div><!--/shape-->
<div data-slot="over"><div id="frame"><img src="../assets/phone_frame.png"></div></div><!--/over-->
<script>
const T0 = 119.05;
const GX = [-560, 560], GY = [-170, 150];
$('grid').innerHTML = GX.map(x => `<div class="gl" style="left:${x}px;top:-460px;width:1.5px;height:920px"></div>`).join('') + GY.map(y => `<div class="gl" style="left:-860px;top:${y}px;width:1720px;height:1.5px"></div>`).join('') +
  GX.flatMap(x => GY.map(y => `<div class="hd" style="left:${x}px;top:${y}px"></div>`)).join('');
['mobile', 'browser', 'package'].forEach((n, i) => { $('i' + i).innerHTML = M.icon(n, 42, '#EA6262', 2); });
const tPhone = 0.15, tSoon = wt(367, T0), tMap = wt(371, T0) - 0.45;
const tB = [wt(371, T0), wt(372, T0) + 0.25, wt(374, T0)], tPath = wt(374, T0) + 0.15;
const scrollT = M.track(0, [[tPhone + 0.6, 1, [0.9, 1]]]);
const cx = M.track(0, [[tMap, -600, M.MORPH]]);
const webIn = M.track(0, [[tB[1] - 0.25, 1, M.MORPH]]), packIn = M.track(0, [[tB[2] - 0.25, 1, M.MORPH]]);
// positions (world) once mapped: phone at -600, browser at +80, pack at +700
const WEB = [80, -10], PACK = [700, -10];
M.scene({
  W: 1920, H: 1080, bg: '#F7CFCE', T: 10.95, intro: null,
  SH: {
    pro:     {w: 1760, h: 940, r: 56, bg: '#EA6262', cam: 1.06},
    screen:  {w: 420, h: 858, r: 54, bg: '#FFFFFF', cam: 1.0},
    screen2: {w: 420, h: 858, r: 54, bg: '#FFFFFF', cam: 0.84}
  },
  start: 'pro', SEQ: [[tPhone, 'screen'], [tMap, 'screen2']],
  layers: [
    {el: 'Lpro', tin: null, tout: tPhone, o: {lout: 0.14}},
    {el: 'Lscreen', tin: tPhone, tout: null, o: {din: 0.05, lin: 0.35}, update: (t) => {
      $('feed').style.top = (-429 - 900 * scrollT(t)) + 'px';
      const v = M.vis(t, tSoon, null, {din: 0, lin: 0.35}), s = $('soon').style;
      if (v.o < 0.002) s.display = 'none'; else { s.display = ''; s.opacity = v.o; s.transform = `translateX(-50%) scale(${(0.9 + 0.1 * v.a).toFixed(4)})`; }
    }}
  ],
  geom: (t, g) => { g.cx = cx(t); return g; },
  extra: (t, g) => {
    // real phone frame sits exactly over the screen (screen hole 525x1072 in a 1200px PNG -> 0.8 scale)
    const f = $('frame').style, fv = M.clamp((t - tPhone - 0.1) / 0.35);
    f.display = fv < 0.002 ? 'none' : ''; f.opacity = fv;
    f.left = (g.cx - 480 - 12.8) + 'px'; f.top = (g.cy - 480 + 2.8) + 'px'; f.transform = `scale(${g.sc.toFixed(4)})`; f.transformOrigin = `${480 + 12.8}px ${480 - 2.8}px`;
    const w = webIn(t), p = packIn(t);
    const W = $('web').style; W.display = w < 0.002 ? 'none' : ''; W.opacity = M.clamp(w * 1.3);
    W.left = (WEB[0] - 360) + 'px'; W.top = (WEB[1] - 240 + (1 - w) * 120) + 'px'; W.transform = `scale(${(0.92 + 0.08 * w).toFixed(4)})`;
    $('webPage').style.top = (44 - 260 * M.clamp((t - tB[1]) / 6)) + 'px';
    const P = $('pack').style; P.display = p < 0.002 ? 'none' : ''; P.opacity = M.clamp(p * 1.3);
    P.left = (PACK[0] - 190) + 'px'; P.top = (PACK[1] - 240 + (1 - p) * 120) + 'px'; P.transform = `scale(${(0.92 + 0.08 * p).toFixed(4)})`;
    const BP = [[g.cx - 210, -430], [WEB[0] - 360, -250], [PACK[0] - 190, -250]];
    const LP = [[g.cx, 480], [WEB[0], 290], [PACK[0], 290]];
    for (let i = 0; i < 3; i++) {
      const a = M.S(t - tB[i], 13, 0.75), b = $('b' + i).style;
      b.display = t < tB[i] ? 'none' : ''; b.left = BP[i][0] + 'px'; b.top = BP[i][1] + 'px'; b.transform = `scale(${Math.max(0, a).toFixed(4)})`;
      show($('l' + i), t, tB[i] + 0.1, null, 16, {din: 0, lin: 0.4}); $('l' + i).style.left = LP[i][0] + 'px'; $('l' + i).style.top = LP[i][1] + 'px';
    }
    // journey line through the three badges, drawn on
    const d = `M${BP[0][0]} ${BP[0][1]} C ${BP[0][0] + 200} ${BP[0][1] - 120}, ${BP[1][0] - 200} ${BP[1][1] - 140}, ${BP[1][0]} ${BP[1][1]} S ${BP[2][0] - 200} ${BP[2][1] - 150}, ${BP[2][0]} ${BP[2][1]}`;
    const jp = $('jp'); jp.setAttribute('d', d);
    const L = 1800, k = M.eio((t - tPath) / 0.9);
    jp.style.strokeDasharray = k >= 1 ? '2 16' : `${(L * k).toFixed(1)} ${L}`; jp.style.opacity = t < tPath ? 0 : 1;
  }
});
</script>
