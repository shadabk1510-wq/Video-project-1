<title>04 NOON: the sun rises, one project</title>
<style>
#logo{position:absolute;left:-360px;top:20px;width:720px;height:179px}
#ring{position:absolute;left:-330px;top:-290px;width:660px;height:660px}
.fill{position:absolute;transform:translate(-50%,-50%)}
.fill img{width:100%;height:100%;object-fit:cover}
</style>
<div data-slot="world">
  <svg id="ring" viewBox="-330 -330 660 660"><defs><path id="circ" d="M0,-300 a300,300 0 1,1 0,600 a300,300 0 1,1 0,-600"/></defs>
    <text font-family="Inter" font-weight="700" font-size="19" fill="#B54A50"><textPath href="#circ" id="ringText" textLength="1870" lengthAdjust="spacing"></textPath></text></svg>
  <div class="row cap" id="tag" data-t="translateX(-50%)" style="left:0;top:372px;transform:translate(-50%,0);font-size:19px">The whole process &middot; one project</div>
</div><!--/world-->
<div data-slot="shape">
  <div class="L" id="Lsun"></div>
  <div class="L" id="Lbag"><div class="fill" style="width:440px;height:440px"><img src="../assets/bag.png"></div></div>
</div><!--/shape-->
<div data-slot="over">
  <svg id="logo" viewBox="0 0 450 112"><g fill="#163452">
    <path id="n1" d="M0 1H42L75 40V1H109V110H70L39 73V110H0Z"/>
    <path id="o1" fill-rule="evenodd" d="M168 0A56 56 0 1 1 168 112A56 56 0 1 1 168 0ZM194 45A12 12 0 1 0 194 69A12 12 0 1 0 194 45Z"/>
    <path id="o2" fill-rule="evenodd" d="M281.5 0A56 56 0 1 1 281.5 112A56 56 0 1 1 281.5 0ZM309.5 45A12 12 0 1 0 309.5 69A12 12 0 1 0 309.5 45Z"/>
    <path id="n2" d="M342 1H385L416 40V1H450V112H412L381 74V112H342Z"/></g></svg>
</div><!--/over-->
<script>
const T0 = 9.98;
$('ringText').textContent = ('BRIEF → PURPOSE → DIRECTION → RULES → REVIEW → HANDOVER → ').repeat(2).trim();
const tSmall = 0.12, tLogo = wt(35, T0) - 0.08, tBag = wt(36, T0), tRing = tBag + 0.45;
// the sun: shrinks and dips behind the (not yet visible) horizon, then rises above the wordmark and settles
const sunY = M.track(-110, [[tSmall, 280, M.SOFT], [tLogo + 0.32, -150, [6.5, 0.9]]]);
const logoUp = M.track(0, [[tBag - 0.05, 1, M.MORPH]]);
const bagY = M.track(-150, [[tBag, 40, M.MORPH]]);
M.scene({
  W: 1920, H: 1080, bg: '#F7CFCE', T: 5.32, intro: null,
  SH: {
    sun:  {w: 300, h: 300, r: 150, bg: '#F4512B', cam: 1.15},
    sun2: {w: 200, h: 200, r: 100, bg: '#F4512B', cam: 1.15},
    bag:  {w: 440, h: 440, r: 36, bg: '#C6C5C4', cam: 1.15}
  },
  start: 'sun', SEQ: [[tSmall, 'sun2'], [tBag, 'bag']],
  layers: [{el: 'Lbag', tin: tBag + 0.05, tout: null, o: {din: 0.05, lin: 0.3}}],
  geom: (t, g) => { g.cy = t < tBag ? sunY(t) : bagY(t); return g; },
  extra: (t, g) => {
    // wordmark letters rise in on "NOON"; it sits OVER the sun so the sun rises from behind it
    ['n1', 'o1', 'o2', 'n2'].forEach((id, i) => { const a = M.S(t - tLogo - i * 0.05, 11, 0.9), e = $(id);
      e.style.opacity = M.clamp(a * 1.4); e.style.transform = `translateY(${((1 - a) * 40).toFixed(2)}px)`; });
    const u = logoUp(t), L = $('logo').style;   // wordmark moves up and shrinks to make room for the bag
    L.transform = `translate(0px,${(-470 * u).toFixed(2)}px) scale(${(1 - 0.62 * u).toFixed(4)})`; L.transformOrigin = '50% 50%';
    $('logo').style.display = t < tLogo - 0.1 ? 'none' : '';
    // the sun hides behind the wordmark while low: fade it while below the horizon line
    if (t < tBag) g.op = 1;
    const rv = M.vis(t, tRing, null, {din: 0, lin: 0.6, blur: 8});
    const R = $('ring').style; R.opacity = rv.o; R.transform = `rotate(${(-t * 9).toFixed(2)}deg) scale(${(0.9 + 0.1 * rv.a).toFixed(4)})`;
    show($('tag'), t, wt(43, T0) - 0.1, null, 12, {din: 0, lin: 0.4});
  }
});
</script>
