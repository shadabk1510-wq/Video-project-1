<title>02 A new way to work in 2027</title>
<style>
.w{display:inline-block;margin-right:.26em}
.fill{position:absolute;transform:translate(-50%,-50%)}
.fill img{width:100%;height:100%;object-fit:cover}
.dg{display:inline-block}
</style>
<div data-slot="shape">
  <div class="L" id="Lpost2"><div class="fill" style="width:600px;height:600px"><img src="../assets/social2.png"></div></div>
  <div class="L" id="Lline"><div class="row k" id="line" style="transform:translate(-50%,-50%);font-size:58px;color:#2B1C1E"></div></div>
  <div class="L" id="Lyear">
    <div class="row" style="transform:translate(-50%,-50%);flex-direction:column;align-items:center;gap:6px;color:#fff">
      <div id="inLbl" style="font-size:30px;font-weight:600;opacity:.85">in</div>
      <div id="year" class="k" style="font-size:250px;line-height:1;letter-spacing:-.06em"></div>
    </div>
  </div>
</div><!--/shape-->
<script>
const T0 = 4.24;
const WI = [7, 8, 9, 10, 11, 12, 13, 14];   // "a new way to work as a designer"
const TXT = ['A', 'new', 'way', 'to', 'work', 'as', 'a', 'designer'];
$('line').innerHTML = TXT.map((w, i) => `<span class="w" id="w${i}">${w}</span>`).join('');
$('year').innerHTML = '2027'.split('').map((d, i) => `<span class="dg" id="d${i}">${d}</span>`).join('');
const tYear = wt(16, T0) - 0.06;
M.scene({
  W: 1920, H: 1080, bg: '#F7CFCE', T: 2.86, intro: null,
  SH: {
    post2: {w: 600, h: 600, r: 36, bg: '#FFFFFF', cam: 1.42},
    line:  {w: 1180, h: 170, r: 85, bg: '#FFFFFF', cam: 1.25},
    year:  {w: 780, h: 440, r: 64, bg: '#EA6262', cam: 1.3}
  },
  start: 'post2', SEQ: [[0.04, 'line'], [tYear, 'year']],
  layers: [
    {el: 'Lpost2', tin: null, tout: 0.04, o: {lout: 0.12}},
    {el: 'Lline', tin: 0.04, tout: tYear, o: {din: 0, lin: 0.01, lout: 0.12}, update: (t) => {
      WI.forEach((wi, i) => { const e = $('w' + i); const v = show(e, t, wt(wi, T0) - 0.04, null, 18, {din: 0, lin: 0.32, blur: 10});
        e.style.color = (i === 1 || i === 2) ? '#EA6262' : '#2B1C1E'; });
    }},
    {el: 'Lyear', tin: tYear, tout: null, o: {din: 0.04, lin: 0.2}, update: (t) => {
      show($('inLbl'), t, tYear + 0.02, null, 10, {din: 0, lin: 0.3});
      for (let i = 0; i < 4; i++) show($('d' + i), t, tYear + 0.06 + i * 0.06, null, 40, {din: 0, lin: 0.42, blur: 16});
    }}
  ]
});
</script>
