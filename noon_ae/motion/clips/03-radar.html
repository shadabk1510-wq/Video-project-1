<title>03 On everybody's radar</title>
<style>
.ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.9);transform:translate(-50%,-50%)}
.gr{position:absolute;border-radius:50%;border:1.5px solid rgba(234,98,98,.28);transform:translate(-50%,-50%)}
.w{display:inline-block;margin-right:.26em}
#sweep{position:absolute;left:-150px;top:-150px;width:300px;height:300px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,0) 290deg,rgba(255,255,255,.55) 358deg,rgba(255,255,255,0) 360deg)}
</style>
<div data-slot="world">
  <div id="grid"></div><div id="rings"></div>
  <div class="row k" id="phrase" style="transform:translate(-50%,0);left:0;top:150px;font-size:56px;color:#2B1C1E"></div>
</div><!--/world-->
<div data-slot="shape">
  <div class="L" id="Lyear"><div class="row k" style="transform:translate(-50%,-50%);font-size:250px;line-height:1;letter-spacing:-.06em;color:#fff">2027</div></div>
  <div class="L" id="Lsun"><div class="a" id="sweep"></div></div>
</div><!--/shape-->
<script>
const T0 = 7.10;
const TXT = ['On', "everybody's", 'radar.'], WI = [24, 25, 26];
$('phrase').innerHTML = TXT.map((w, i) => `<span class="w" id="w${i}">${w}</span>`).join('');
$('grid').innerHTML = [380, 560, 740, 920].map(d => `<div class="gr" style="left:0;top:-110px;width:${d}px;height:${d}px"></div>`).join('');
$('rings').innerHTML = [0, 1, 2].map(i => `<div class="ring" id="r${i}" style="left:0;top:-110px"></div>`).join('');
const tSun = 0.08, tRadar = wt(26, T0);
const camT = M.track(1.3, [[tSun, 1.15, M.CAM]]);
M.scene({
  W: 1920, H: 1080, bg: '#F7CFCE', T: 2.88, intro: null,
  SH: {
    year: {w: 780, h: 440, r: 64, bg: '#EA6262', cam: 1.3},
    sun:  {w: 300, h: 300, r: 150, bg: '#F4512B', cam: 1.15}
  },
  start: 'year', SEQ: [[tSun, 'sun']],
  layers: [
    {el: 'Lyear', tin: null, tout: tSun, o: {lout: 0.12}},
    {el: 'Lsun', tin: tSun + 0.2, tout: null, update: (t) => { $('sweep').style.transform = `rotate(${(t * 150) % 360}deg)`; }}
  ],
  geom: (t, g) => { g.cy = -110 * M.S(t - tSun, 9, 0.95); return g; },
  extra: (t, g) => {
    // faint radar grid grows in with the sun
    const gv = M.eo((t - tSun - 0.2) / 0.8);
    $('grid').style.opacity = gv; $('grid').style.transform = `scale(${0.85 + 0.15 * gv})`;
    TXT.forEach((w, i) => show($('w' + i), t, wt(WI[i], T0) - 0.05, null, 18, {din: 0, lin: 0.34, blur: 10}));
    $('w2').style.color = '#EA6262';
    for (let i = 0; i < 3; i++) {     // pings on "radar"
      const u = M.clamp((t - tRadar - i * 0.18) / 1.3), e = $('r' + i).style;
      if (u <= 0) { e.display = 'none'; continue; }
      e.display = ''; const d = 300 + 900 * M.eo(u);
      e.width = d + 'px'; e.height = d + 'px'; e.opacity = (1 - u) * 0.9;
    }
  }
});
</script>
